# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Firebase ──────────────────────────────────────────────────────────────────
# Path to your Firebase service-account key JSON file (or set FIREBASE_CREDENTIALS env var)
firebase.credentials.path=${FIREBASE_CREDENTIALS:}
firebase.project.id=${FIREBASE_PROJECT_ID:}

# Admin bootstrap: on startup this user is given the {admin:true} custom claim
admin.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}

# ── Mail / SMTP ───────────────────────────────────────────────────────────────
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

reminder.from.email=${REMINDER_FROM_EMAIL:${SMTP_USER:}}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.medicinetracker=INFO
