<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Log – Smart Medicine Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <span class="logo-icon">💊</span>
        <h1>MedTracker</h1>
        <button class="sidebar-close-btn" id="sidebarCloseBtn">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">         <span class="nav-icon">🏠</span> Dashboard</a>
        <a href="add-medicine.html">      <span class="nav-icon">💊</span> Medicines</a>
        <a href="health.html" class="active"><span class="nav-icon">❤️</span> Health Log</a>
        <a href="reports.html">           <span class="nav-icon">📊</span> Reports</a>
        <a href="admin.html" id="adminLink" class="hidden"><span class="nav-icon">🛡️</span> Admin</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-avatar" id="sidebarAvatar">U</div>
        <div class="user-info">
          <div class="user-name"  id="sidebarUserName">Loading…</div>
          <div class="user-email" id="sidebarUserEmail"></div>
        </div>
        <button class="btn-icon" title="Sign out" onclick="window.logoutUser()">🚪</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <div class="main-content">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:.75rem">
          <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
          <span class="topbar-title">Health Log</span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" onclick="openLogModal()">+ Log Health</button>
          <button class="theme-toggle" id="themeToggle">🌙</button>
        </div>
      </header>

      <main class="page-content">
        <!-- Summary Cards -->
        <div class="stats-grid" id="healthSummary" style="margin-bottom:1.5rem"></div>

        <!-- Log Table -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">Health History</h2>
          </div>
          <div id="logTable">
            <div class="empty-state">
              <div class="empty-icon">❤️</div>
              <p>No health logs yet. Start tracking your vitals!</p>
              <button class="btn btn-primary" onclick="openLogModal()">Log Health Data</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Log Modal -->
  <div class="modal-backdrop hidden" id="logModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Log Health Data</h2>
        <button class="btn-icon" onclick="closeLogModal()">✕</button>
      </div>
      <form id="logForm" onsubmit="saveLog(event)">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Date</label>
            <input class="form-control" type="date" id="logDate" required />
          </div>
          <div class="form-group">
            <label class="form-label">Time</label>
            <input class="form-control" type="time" id="logTime" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Blood Pressure Systolic (mmHg)</label>
            <input class="form-control" type="number" id="logBpSys" placeholder="e.g. 120" min="50" max="250" />
          </div>
          <div class="form-group">
            <label class="form-label">Blood Pressure Diastolic (mmHg)</label>
            <input class="form-control" type="number" id="logBpDia" placeholder="e.g. 80" min="30" max="150" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Heart Rate (bpm)</label>
            <input class="form-control" type="number" id="logHr" placeholder="e.g. 72" min="30" max="250" />
          </div>
          <div class="form-group">
            <label class="form-label">Blood Sugar (mg/dL)</label>
            <input class="form-control" type="number" id="logBs" placeholder="e.g. 95" min="20" max="600" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Weight (kg)</label>
            <input class="form-control" type="number" id="logWeight" placeholder="e.g. 70" step="0.1" min="1" max="500" />
          </div>
          <div class="form-group">
            <label class="form-label">Temperature (°C)</label>
            <input class="form-control" type="number" id="logTemp" placeholder="e.g. 36.6" step="0.1" min="30" max="45" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Notes</label>
          <textarea class="form-control" id="logNotes" rows="2" placeholder="How are you feeling?"></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1rem">
          <button type="button" class="btn btn-ghost" onclick="closeLogModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Log</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, logout, isAdmin, populateSidebarUser, initTheme, toggleTheme, showToast, apiCall, initMobileMenu } from "./js/auth.js";

    initTheme();
    initMobileMenu();
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);
    window.logoutUser = logout;

    const user = await requireAuth(true);
    populateSidebarUser(user);
    if (await isAdmin()) document.getElementById("adminLink").classList.remove("hidden");

    // Set today's date as default
    document.getElementById("logDate").value = new Date().toISOString().slice(0,10);
    document.getElementById("logTime").value = new Date().toTimeString().slice(0,5);

    let logs = [];

    async function loadLogs() {
      try {
        logs = await apiCall("/api/health");
        renderSummary();
        renderTable();
      } catch (e) {
        showToast("Failed to load health logs: " + e.message, "error");
      }
    }

    function renderSummary() {
      if (!logs.length) { document.getElementById("healthSummary").innerHTML = ""; return; }
      const latest = logs[0];
      document.getElementById("healthSummary").innerHTML = `
        <div class="stat-card">
          <div class="stat-icon red" style="background:#fef2f2;color:#ef4444">❤️</div>
          <div>
            <div class="stat-value">${latest.heartRate || "–"}</div>
            <div class="stat-label">Heart Rate (bpm)</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue">🩺</div>
          <div>
            <div class="stat-value">${latest.bloodPressureSystolic ? latest.bloodPressureSystolic + "/" + latest.bloodPressureDiastolic : "–"}</div>
            <div class="stat-label">Blood Pressure</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">🍬</div>
          <div>
            <div class="stat-value">${latest.bloodSugar || "–"}</div>
            <div class="stat-label">Blood Sugar (mg/dL)</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">⚖️</div>
          <div>
            <div class="stat-value">${latest.weight || "–"}</div>
            <div class="stat-label">Weight (kg)</div>
          </div>
        </div>`;
    }

    function renderTable() {
      const el = document.getElementById("logTable");
      if (!logs.length) {
        el.innerHTML = `<div class="empty-state">
          <div class="empty-icon">❤️</div>
          <p>No health logs yet. Start tracking your vitals!</p>
          <button class="btn btn-primary" onclick="openLogModal()">Log Health Data</button>
        </div>`;
        return;
      }
      el.innerHTML = `
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Date</th><th>Time</th><th>BP</th><th>HR</th><th>Blood Sugar</th><th>Weight</th><th>Temp</th><th>Notes</th>
            </tr></thead>
            <tbody>${logs.map(l => `
              <tr>
                <td>${l.date || "–"}</td>
                <td>${l.time || "–"}</td>
                <td>${l.bloodPressureSystolic ? l.bloodPressureSystolic + "/" + l.bloodPressureDiastolic : "–"}</td>
                <td>${l.heartRate ? l.heartRate + " bpm" : "–"}</td>
                <td>${l.bloodSugar ? l.bloodSugar + " mg/dL" : "–"}</td>
                <td>${l.weight ? l.weight + " kg" : "–"}</td>
                <td>${l.temperature ? l.temperature + "°C" : "–"}</td>
                <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.notes || ""}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    window.openLogModal = () => document.getElementById("logModal").classList.remove("hidden");
    window.closeLogModal = () => document.getElementById("logModal").classList.add("hidden");

    window.saveLog = async (e) => {
      e.preventDefault();
      const payload = {
        date:                   document.getElementById("logDate").value,
        time:                   document.getElementById("logTime").value,
        bloodPressureSystolic:  parseFloat(document.getElementById("logBpSys").value) || null,
        bloodPressureDiastolic: parseFloat(document.getElementById("logBpDia").value) || null,
        heartRate:              parseFloat(document.getElementById("logHr").value) || null,
        bloodSugar:             parseFloat(document.getElementById("logBs").value) || null,
        weight:                 parseFloat(document.getElementById("logWeight").value) || null,
        temperature:            parseFloat(document.getElementById("logTemp").value) || null,
        notes:                  document.getElementById("logNotes").value.trim()
      };
      try {
        await apiCall("/api/health", "POST", payload);
        showToast("Health log saved!", "success");
        document.getElementById("logForm").reset();
        document.getElementById("logDate").value = new Date().toISOString().slice(0,10);
        closeLogModal();
        await loadLogs();
      } catch (e) {
        showToast("Error: " + e.message, "error");
      }
    };

    await loadLogs();
  </script>
</body>
</html>
